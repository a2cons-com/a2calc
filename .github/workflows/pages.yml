# calc.a2cons.com: builds site/ (plus TERMS.md and PRIVACY.md) with
# scripts/site-build.mjs and publishes it to GitHub Pages.
# One-time repo setup: Settings > Pages > Source: GitHub Actions; custom
# domain calc.a2cons.com (DNS: CNAME calc -> a2cons-com.github.io), then
# Enforce HTTPS.
name: Site
on:
  push:
    branches: [main]
    paths: [site/**, TERMS.md, PRIVACY.md, scripts/site-build.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/site-build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
