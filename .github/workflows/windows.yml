# Windows app: built on GitHub's Windows runners with Tauri (system
# WebView2, nothing bundled but the web build). A pushed version tag
# (v0.1.2) builds and attaches the installer and a standalone .exe to that
# tag's GitHub release; changes to the Windows app build without releasing.
name: Windows

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install
        run: npm ci

      - name: Web build
        run: npm run build

      - name: Version
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./config/app.json').marketingVersion")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::warning::tag ${GITHUB_REF#refs/tags/} differs from config/app.json version $v"
          fi

      - name: Icons
        run: npx tauri icon resources/icon-desktop.png -o windows/src-tauri/icons

      - name: Build
        shell: bash
        working-directory: windows
        run: npx tauri build --config "{\"version\":\"${{ steps.version.outputs.version }}\"}"

      - name: Collect
        id: files
        shell: bash
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p dist-windows
          cp windows/src-tauri/target/release/bundle/nsis/*-setup.exe "dist-windows/A2-Calc-$v-setup.exe"
          cp windows/src-tauri/target/release/a2-calc.exe "dist-windows/A2-Calc-$v-portable.exe"
          ls -l dist-windows

      - uses: actions/upload-artifact@v4
        with:
          name: A2-Calc-windows-${{ steps.version.outputs.version }}
          path: dist-windows/*.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-windows/*.exe
          fail_on_unmatched_files: true
